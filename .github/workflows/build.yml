name: build
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - name: ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
      - run: pyinstaller --noconfirm --onefile --windowed --name CassetteReels --add-binary "ffmpeg.exe;." app.py
      - name: pack
        shell: pwsh
        run: |
          Copy-Item -Recurse assets dist/assets
          Copy-Item README.txt dist/
      - uses: actions/upload-artifact@v4
        with: { name: CassetteReels, path: dist }
